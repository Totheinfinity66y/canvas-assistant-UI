name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python -B -m unittest discover -s tests -p "test_canvas_manager*.py" -v
      - run: node --test tests/test_canvas_frontend.cjs
