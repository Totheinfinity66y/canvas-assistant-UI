<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>作业进度</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#203247;font:16px Segoe UI,Microsoft YaHei,sans-serif}main{max-width:1200px;margin:auto;padding:28px}nav{display:flex;gap:20px;align-items:center;flex-wrap:wrap;margin-bottom:32px}a{color:#156a73}nav a{text-decoration:none;padding:9px;border-radius:8px}nav a[aria-current]{background:#deeeeb;color:#165e54;font-weight:700}h1{margin-bottom:8px;font-size:30px}p,small{color:#5c6c7e;line-height:1.6}header{display:flex;justify-content:space-between;gap:20px;align-items:center}button,input,select{font:inherit;padding:10px 14px;border:1px solid #cbd6e0;border-radius:8px;background:white}button{cursor:pointer;background:#176e66;color:white}button:disabled{opacity:.5;cursor:default}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:24px 0}.stat{background:white;border:1px solid #dfe6ee;border-radius:12px;padding:20px}.stat strong{display:block;font-size:34px;margin-top:8px}.stat.danger{border:2px solid #bc4141;background:#fff2f1;color:#9e2525}.stat.warning{border:2px solid #cc8a2e;background:#fff8e9;color:#8c570b}.filters{display:flex;gap:12px;flex-wrap:wrap;margin:22px 0}.filters input{flex:1;min-width:180px}.status{background:white;border:1px solid #dfe6ee;border-radius:10px;padding:16px;margin-top:16px}progress{width:100%;accent-color:#176e66}section{margin:28px 0}h2{font-size:21px}.group-overdue h2{color:#a22929}.group-pending h2{color:#915b11}.assignment{background:white;border:1px solid #dce4ed;border-left:5px solid #94a9ba;border-radius:10px;padding:18px 20px;margin:12px 0;display:grid;grid-template-columns:1fr auto;gap:12px}.assignment.overdue{border-left-color:#bf3939;background:#fff5f3}.assignment.pending{border-left-color:#d8942f}.assignment h3{font-size:18px;margin:4px 0 8px;overflow-wrap:anywhere}.assignment p{margin:4px 0}.assignment .state{font-weight:700}.assignment.overdue .state{color:#ac2020}.assignment.pending .state{color:#925b00}.assignment a{display:inline-block;border:1px solid #c9d6df;border-radius:8px;padding:10px;text-decoration:none;align-self:center;white-space:nowrap}.error{color:#aa2727;white-space:pre-wrap}.empty{padding:25px;color:#65788b;background:#fff;border-radius:10px}footer{color:#607286;font-size:13px;margin-top:40px}#setupHint{background:#fff0cf;padding:16px;border-radius:8px}details summary{cursor:pointer;font-weight:700}@media(max-width:650px){main{padding:16px}.stats{grid-template-columns:1fr 1fr}header{align-items:flex-start;flex-direction:column}.assignment{grid-template-columns:1fr}}
</style>
<main>
<nav><strong id="appTitle">Canvas 学习助手</strong><a href="/assignments" id="assignmentsNav" aria-current="page">作业进度</a><a href="/files" id="filesNav">资料下载</a><a href="/setup">账号与学期设置</a></nav>
<header><div><h1 id="pageTitle">作业进度</h1><p id="semester">先处理逾期和即将截止的作业</p></div><button id="scan">刷新全部课程作业</button></header>
<p id="setupHint" hidden>尚未配置账号。<a href="/setup">打开首次使用向导</a>，填写 Token 和保存位置后即可使用。</p>
<div class="stats"><div class="stat danger">逾期未交<strong id="overdueCount">—</strong></div><div class="stat warning">待提交<strong id="pendingCount">—</strong></div><div class="stat">已提交 / 已评分<strong id="doneCount">—</strong></div><div class="stat">状态未知<strong id="unknownCount">—</strong></div></div>
<div class="status" aria-live="polite"><strong id="message">点击刷新，读取 Canvas 最新提交状态</strong><small id="time"></small><progress id="progress" value="0" max="1"></progress><div id="errors" class="error"></div></div>
<div class="filters"><select id="course" aria-label="筛选课程"><option value="">全部课程</option></select><input id="search" type="search" placeholder="搜索课程或作业" aria-label="搜索作业"><select id="scope" aria-label="筛选提交状态"><option value="all">全部作业</option><option value="todo">只看未交 / 逾期</option><option value="unknown">只看状态未知</option></select></div>
<div id="groups"></div><div id="empty" class="empty">刷新后在此查看作业。未扫描或读取失败时，不会显示为“无作业”。</div>
<footer>截止时间统一为上海时间（UTC+8）。本地是否下载与作业是否提交分别统计。未知状态须到 Canvas 核对；部分课程读取失败会单独列出。实际提交请在 Canvas 页面操作。</footer>
</main>
<script>
const $=id=>document.getElementById(id),csrf='__CSRF__';let inventory={items:[],errors:[]},busy=false,last='',preferences={};
function el(tag,text,cls){const node=document.createElement(tag);node.textContent=text;if(cls)node.className=cls;return node}
function group(item){if(item.submission==='状态未知')return 'unknown';if(item.submission==='免交')return 'excused';if(['已提交','已评分'].includes(item.submission))return 'done';const due=item.due_at?Date.parse(item.due_at):NaN;return Number.isFinite(due)&&due<Date.now()?'overdue':'pending'}
function render(){
 const all=inventory.items.filter(i=>i.kind==='assignment'),counts={overdue:0,pending:0,done:0,unknown:0,excused:0};for(const i of all)counts[group(i)]++;
 for(const k of ['overdue','pending','done','unknown'])$(k+'Count').textContent=inventory.scanned_at?counts[k]:'—';
 const q=$('search').value.toLowerCase(),scope=$('scope').value;let visible=all.filter(i=>(!$('course').value||String(i.course_id)===$('course').value)&&(!q||(i.course+' '+i.name).toLowerCase().includes(q))&&(scope==='all'||(scope==='todo'&&['overdue','pending'].includes(group(i)))||(scope==='unknown'&&group(i)==='unknown')));
 const titles={overdue:'⛔ 逾期未交 · 优先处理',pending:'⏰ 待提交 · 按截止时间排序',unknown:'需要核对 · 状态未知',done:'已提交 / 已评分',excused:'免交作业'};const groups=$('groups');groups.replaceChildren();
 for(const key of ['overdue','pending','unknown','done','excused']){const rows=visible.filter(i=>group(i)===key).sort((a,b)=>(Date.parse(a.due_at)||Infinity)-(Date.parse(b.due_at)||Infinity));if(!rows.length)continue;
 const section=document.createElement(['done','excused'].includes(key)?'details':'section');section.className='group-'+key;section.append(el(['done','excused'].includes(key)?'summary':'h2',titles[key]+' ('+rows.length+')'));
 for(const i of rows){let card=el('article','','assignment '+key),content=document.createElement('div');content.append(el('small',i.course),el('h3',i.name),el('p',key==='overdue'?'逾期未交':i.submission,'state'));content.append(el('p','截止（上海）：'+(i.due_local||'无截止时间')));if(key==='overdue'){const hours=Math.max(1,Math.floor((Date.now()-Date.parse(i.due_at))/3600000));content.append(el('small','已逾期 '+(hours>=24?Math.floor(hours/24)+' 天':hours+' 小时')))}card.append(content);if(i.canvas_url){let link=el('a','去 Canvas 查看 / 提交');link.href=i.canvas_url;link.target='_blank';link.rel='noopener noreferrer';card.append(link)}section.append(card)}groups.append(section)}
 $('empty').hidden=visible.length>0;$('empty').textContent=inventory.scanned_at?(all.length?'当前筛选没有匹配作业':inventory.errors.length?'部分读取失败，请查看错误后重试':'已扫描所选课程，未发现作业'):'刷新后在此查看作业。未扫描或读取失败时，不会显示为“无作业”。';
}
for(const id of ['course','search','scope'])$(id).addEventListener('input',render);
async function poll(){try{let r=await fetch('/api/state');if(!r.ok)throw Error('状态读取失败');let data=await r.json();preferences=data.preferences||{};busy=data.state.busy;$('scan').disabled=busy||!preferences.configured;$('setupHint').hidden=preferences.configured;$('message').textContent=data.state.message;$('progress').max=data.state.total||1;$('progress').value=data.state.current||0;
 const settings=preferences.settings||{},labels=settings.labels||{};$('appTitle').textContent=labels.app_title||'Canvas 学习助手';$('filesNav').textContent=labels.files_title||'资料下载';$('assignmentsNav').textContent=labels.assignments_title||'作业进度';$('pageTitle').textContent=labels.assignments_title||'作业进度';document.title=$('pageTitle').textContent;$('semester').textContent=settings.semester?settings.semester+' · 优先处理逾期和待交作业':'先处理逾期和即将截止的作业';
 let fingerprint=JSON.stringify(data.inventory);if(fingerprint!==last){last=fingerprint;inventory=data.inventory;let current=$('course').value;$('course').replaceChildren(new Option('全部课程',''));let courses=new Map(inventory.items.filter(i=>i.kind==='assignment').map(i=>[String(i.course_id),i.course]));for(const [id,name]of courses)$('course').add(new Option(name,id));$('course').value=courses.has(current)?current:'';$('errors').textContent=inventory.errors.map(e=>'课程 '+(e.course_id||'')+' '+(e.section||'')+'：'+e.error).join('\n');$('time').textContent=inventory.scanned_at?' · 数据更新于 '+new Date(inventory.scanned_at).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai'}):'';render()}
 }catch(e){$('message').textContent='本地服务连接中断：'+e.message}}
$('scan').onclick=async()=>{try{$('scan').disabled=true;let r=await fetch('/api/scan',{method:'POST',headers:{'Content-Type':'application/json','X-Canvas-CSRF':csrf},body:'{}'});let data=await r.json();if(!r.ok)throw Error(data.error);await poll()}catch(e){$('message').textContent=e.message;$('scan').disabled=false}};
poll();setInterval(poll,1000);setInterval(render,60000);
</script></html>
